name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release: tag=${TAG}, version=${VERSION}"

      - name: Sync MARKETING_VERSION in project.yml
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"${VERSION}\"/" project.yml
          grep "MARKETING_VERSION" project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate into temporary keychain
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/peek-signing.keychain-db"
          KC_PASS="$(openssl rand -base64 24)"
          CERT_FILE="$RUNNER_TEMP/Peek-Self-Signed.p12"

          printf '%s' "$SIGNING_CERT_P12_BASE64" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN"
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Build and package arm64 & x86_64 releases
        run: ./tools/package.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Peek ${TAG}" \
              --generate-notes
          fi

      - name: Update Homebrew Tap Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN not configured; skipping Homebrew Tap update."
            exit 0
          fi
          VERSION="${{ steps.meta.outputs.version }}"
          ARM_SHA="$(awk -v f="Peek-${VERSION}-arm64.dmg" '$2 == f { print $1 }' dist/SHA256SUMS.txt)"
          INTEL_SHA="$(awk -v f="Peek-${VERSION}-x86_64.dmg" '$2 == f { print $1 }' dist/SHA256SUMS.txt)"

          if [[ -z "$ARM_SHA" || -z "$INTEL_SHA" ]]; then
            echo "Error: failed to read arm64/x86_64 SHA-256 from dist/SHA256SUMS.txt" >&2
            exit 1
          fi

          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/athlan20/homebrew-tap.git" "$TAP_DIR"
          cd "$TAP_DIR"
          git config user.name "athlan20"
          git config user.email "64818614@qq.com"

          mkdir -p Casks
          cat > Casks/peek.rb <<RUBY
          cask "peek" do
            arch arm: "arm64", intel: "x86_64"

            version "${VERSION}"
            sha256 arm:   "${ARM_SHA}",
                   intel: "${INTEL_SHA}"

            url "https://github.com/athlan20/peek/releases/download/v#{version}/Peek-#{version}-#{arch}.dmg"
            name "Peek"
            desc "Sub-1MB native macOS menubar system monitor, disk analyzer, and app uninstaller"
            homepage "https://github.com/athlan20/peek"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: ">= :sonoma"

            app "Peek.app"

            zap trash: [
              "~/Library/Application Support/Peek",
              "~/Library/Preferences/cc.yuntianyou.peek.plist",
              "~/Library/Caches/cc.yuntianyou.peek",
            ]
          end
          RUBY

          # Strip leading indentation added by heredoc
          sed -i '' 's/^          //' Casks/peek.rb
          ruby -c Casks/peek.rb

          if git diff --quiet Casks/peek.rb && [[ -n "$(git ls-files Casks/peek.rb)" ]]; then
            echo "Casks/peek.rb is already up to date."
          else
            git add Casks/peek.rb
            git commit -m "cask: update peek to ${VERSION}"
            git push origin main
          fi

      - name: Clean up temporary keychain and certificate
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/peek-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/Peek-Self-Signed.p12"
